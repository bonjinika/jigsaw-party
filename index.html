<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>みんなのジグソー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: a lobby card first; inside a room, one scaled stage with the frame on the left and the piece tray on the right. */
:root {
  color-scheme: light;
  --bg: #eef1f6;
  --surface: #ffffff;
  --fg: #1a2233;
  --muted: #5d6779;
  --line: #cfd6e2;
  --accent: #d9482b;
  --accent-fg: #ffffff;
  --slot: rgba(26, 34, 51, 0.28);
  --stage: #e3e8f0;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151d; --surface: #1b2030; --fg: #e7ebf3; --muted: #9aa5b8; --line: #2d3550;
    --accent: #ef6a4c; --accent-fg: #1a0f0b; --slot: rgba(231, 235, 243, 0.30); --stage: #181d2b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151d; --surface: #1b2030; --fg: #e7ebf3; --muted: #9aa5b8; --line: #2d3550;
  --accent: #ef6a4c; --accent-fg: #1a0f0b; --slot: rgba(231, 235, 243, 0.30); --stage: #181d2b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-inline: 16px; padding-block: 20px 40px; min-height: 100vh;
}
.wrap { max-width: 1240px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 4vw, 32px); line-height: 1.2; margin: 0; letter-spacing: 0.02em; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.stats { display: flex; gap: 20px; font-variant-numeric: tabular-nums; }
.stat { display: flex; flex-direction: column; }
.stat span { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; }
.stat b { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1.2; }
select, button, input[type="text"] {
  font: inherit; font-size: 14px; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; min-height: 38px;
}
button, select { cursor: pointer; }
button:hover, select:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.bar label { color: var(--muted); font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }

/* lobby */
#lobby { max-width: 640px; margin-inline: auto; width: 100%; display: flex; flex-direction: column; gap: 16px; }
#lobby h2 { font-family: var(--font-display); font-size: 20px; margin: 0; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label { font-size: 13px; color: var(--muted); }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.pick { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 8px; height: auto; }
.pick canvas { width: 100%; height: auto; border-radius: 4px; display: block; }
.pick span { font-size: 13px; line-height: 1.4; }
.pick[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 0; background: var(--surface); color: var(--fg); border-color: var(--accent); }
.msg { margin: 0; color: var(--muted); font-size: 13px; }
.msg.err { color: var(--accent); }

/* room */
#room { display: flex; flex-direction: column; gap: 14px; }
.people { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 10px 3px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.invite { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.invite input { flex: 1 1 240px; min-width: 0; }
#viewport { width: 100%; max-height: 78vh; overflow: auto; border-radius: 10px; background: var(--stage); }
#stage { position: relative; touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden; }
#frame { position: absolute; border-radius: 2px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
#frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#ghost { opacity: 0.32; }
#tray { position: absolute; border: 1px dashed var(--line); border-radius: 8px; pointer-events: none; }
#trayLabel { position: absolute; font-size: 11px; letter-spacing: 0.1em; color: var(--muted); pointer-events: none; }
.piece { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.38)); }
.piece.locked { filter: none; }
.cur { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 3000; display: flex; align-items: flex-start; gap: 2px; }
.cur svg { width: 16px; height: 16px; flex: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.4)); }
.cur span { font-size: 11px; line-height: 1; padding: 3px 6px; border-radius: 4px; color: #fff; white-space: nowrap; margin-top: 10px; }
.done h3 { font-family: var(--font-display); font-size: 20px; margin: 0 0 6px; }
.done ul { margin: 6px 0 12px; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 14px; }
.note { color: var(--muted); font-size: 12.5px; margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>みんなのジグソー</h1>
      <p class="sub" id="subtitle">みんなで同じ盤面を、同時に組み立てます。</p>
    </div>
    <div class="stats" id="stats" hidden aria-live="polite">
      <div class="stat"><span>経過時間</span><b id="time">0:00</b></div>
      <div class="stat"><span>はまった数</span><b id="count">0 / 0</b></div>
    </div>
  </header>

  <section id="lobby" class="card">
    <h2 id="lobbyTitle">パズルを始める</h2>
    <div class="field">
      <label for="name">あなたの名前(みんなに表示されます)</label>
      <input id="name" type="text" maxlength="12" placeholder="例:いか" autocomplete="nickname">
    </div>
    <div id="createOnly" style="display:contents">
      <div class="field">
        <label>パズルの絵</label>
        <div class="picks" id="picks"></div>
      </div>
      <div class="field">
        <label for="size">ピース数</label>
        <select id="size">
          <option value="4x3">12ピース(かんたん)</option>
          <option value="6x4" selected>24ピース</option>
          <option value="8x6">48ピース(じっくり)</option>
        </select>
      </div>
    </div>
    <div class="bar">
      <button id="go" class="primary" type="button">部屋を作る</button>
      <button id="toCreate" type="button" hidden>自分で新しい部屋を作る</button>
    </div>
    <p class="msg" id="lobbyMsg"></p>
    <p class="msg">スマホは横向きが遊びやすいです。ピースが小さいときは「拡大」を使ってください。</p>
  </section>

  <section id="room" hidden>
    <div class="card invite" id="inviteBar">
      <span class="msg" style="margin:0">招待リンク</span>
      <input id="inviteUrl" type="text" readonly aria-label="招待リンク">
      <button id="copy" type="button">コピー</button>
    </div>
    <div class="bar">
      <div class="people" id="people" aria-label="参加中のメンバー"></div>
    </div>
    <div class="bar">
      <label for="zoom">拡大</label>
      <select id="zoom">
        <option value="1">ぴったり</option>
        <option value="1.5">1.5倍</option>
        <option value="2">2倍</option>
        <option value="3">3倍</option>
      </select>
      <button id="peek" type="button" aria-pressed="false">見本を重ねる</button>
      <button id="nextBtn" class="primary" type="button" hidden>次のパズルへ</button>
    </div>
    <div id="done" class="card done" hidden>
      <h3 id="doneTitle">完成!</h3>
      <ul id="doneList"></ul>
      <button id="again" type="button" class="primary">もう一度あそぶ</button>
    </div>
    <div id="viewport">
      <div id="stage" aria-label="ジグソーパズルの盤面">
        <div id="frame"><canvas id="ghost" hidden></canvas><canvas id="slots"></canvas></div>
        <div id="tray"></div>
        <div id="trayLabel">ピース置き場</div>
        <div id="cursors"></div>
      </div>
    </div>
    <p class="note">誰かが持っているピースは色の光で囲まれ、その人が離すまで動かせません。空いている場所をドラッグすると、拡大中の画面を動かせます。</p>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
